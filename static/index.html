<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="css/style.css">
		<title>The HangMan-Game</title>
	</head>

	<body>
		<!-- Pantalla de inicio. -->
		<div id="screen-start" class="screen">
			<!-- Barra superior con nombre y botón de cambio de tema. -->
			<div class="top-bar">
				<span class="brand">JANDORTIZ</span>
				<button id="theme-toggle" class="theme-btn">☾</button>
			</div>

			<!-- Contenido central de la página. -->
			<div class="center-content">
				<div id="start-hangman"></div>
				<h1 class="game-title">Hangman</h1>
				<p class="game-subtitle">Guess the word before it's too late.</p>
				<button id="start-btn">START GAME</button>
			</div>

		
		</div>

		<!-- Pantalla del juego. -->
		<div id="screen-game" class="screen" style="display:none"> 
			<!-- Zona del Header. -->
			<div class="game-header">
				<div class="game-header-left">
					<span class="brand">JANDORTIZ</span>
					<span class="game-header-title">Hangman</span>
				</div>

				<div class="game-header-right">
					<button id="theme-toggle" class="theme-btn">☾</button>
					<span id="attempts-display"> 6 attempts</span>
				</div>
			</div>
			
			<!-- Zona de la imagen del ahorcado. -->
			<div id="hangman-container"></div>

			<!-- Zona de la palabra buscada.  -->
			<div id="word-display"></div>

			<!-- Zona de la pista. -->
			<div id="hint-panel" class="hint-panel">
				<span> 💡 </span> <span id="hint-text"></span> 
			</div>

			<!-- Zona del teclado. -->
			<div id="keyboard"></div>

			<!-- Letras erróneas. -->
			<div id="wrong-letters"></div>
		</div>


		<!-- Pantalla de resultados. -->
		<div id="screen-result" class="screen" style="display:none">
			<div id="result-content">
				<div id="result-hangman"></div>

				<h1 id="result-message" class="result-title"></h1>
				<div id="result-word"></div>
				<button id="play-again-btn" class="btn-primary">PLAY AGAIN</button>
			</div>

		</div>
